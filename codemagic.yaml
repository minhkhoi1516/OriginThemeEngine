# Manual builds only. Personal accounts currently include M2 minutes;
# Linux/M4/Windows require a different billing plan. See docs/CODEMAGIC.md.
workflows:
  ote-android-debug:
    name: OTE Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - $CM_BUILD_DIR/.tooling/gradle
    scripts:
      - name: Build APK and run verification
        script: python3 scripts/ci_build.py
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - build/ci/**
      - build/reports/**
      - core/*/build/reports/**
      - core/*/build/test-results/**
      - engine/*/build/reports/**
      - engine/*/build/test-results/**
      - data/build/reports/**
      - data/build/test-results/**
      - app/build/reports/**
      - app/build/test-results/**
