name: OTE Android build

on:
  workflow_dispatch:
  push:
    branches: [main, 'ote/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ote-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # Development signing only. Never use this cache as a production signing key.
      # Keep the project private; configure owner-controlled release secrets later.
      - name: Reuse development signing identity for test updates
        if: github.event_name != 'pull_request' && github.event.repository.private
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ote-development-signing-v1-${{ github.repository_id }}
      - name: Host checks
        run: |
          python3 scripts/validate_project.py
          python3 scripts/test_gradle_bootstrap.py
          python3 scripts/test_device_transaction.py
          python3 scripts/test_device_recovery.py
      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log
      - name: Kotlin unit tests and Android lint
        run: |
          ./gradlew :core:root:test :engine:pack:test :engine:png:test :data:testDebugUnitTest :engine:device:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --continue --stacktrace --console=plain 2>&1 | tee verification-gradle.log
      - name: APK checksum
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          fi
      - name: Upload debug APK
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: OTE-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain signing tool for owner-side final signing
        if: always()
        run: |
          mkdir -p owner-signing-tool
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" owner-signing-tool/
          java -cp owner-signing-tool/apksigner.jar com.android.apksigner.ApkSignerTool version
      - name: Upload owner-side signing tool
        if: always() && hashFiles('owner-signing-tool/apksigner.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: OTE-signing-tool
          path: owner-signing-tool/apksigner.jar
          retention-days: 3
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OTE-reports-${{ github.run_number }}
          path: |
            build-debug.log
            verification-gradle.log
            build/reports/
            core/*/build/reports/
            engine/*/build/reports/
            data/build/reports/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
